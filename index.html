<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>空手大会 試合進行表示</title><style>body{margin:0;background:#f2f5fa;color:#17243b;font-family:system-ui,sans-serif}header{background:#102d59;color:white;padding:22px;text-align:center}h1{font-size:clamp(20px,4vw,30px);margin:0 0 7px}.wrap{max-width:1100px;margin:auto;padding:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}button,select,input{font:inherit;border-radius:9px;padding:11px;border:1px solid #cbd5e1}button{background:#fff;cursor:pointer}button.active,.primary{background:#1355ad;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card{background:white;border-radius:16px;padding:22px;text-align:center;box-shadow:0 3px 14px #152d5014}.name{font-weight:800;font-size:23px}.num{font-size:75px;font-weight:900;color:#1558b0;line-height:1.35}.status{display:inline-block;border-radius:99px;background:#e9f0fc;padding:7px 16px;font-weight:700}.control{max-width:540px;margin:auto}.control label{display:block;margin:16px 0 6px;font-weight:700}.control input,.control select{width:100%;box-sizing:border-box}.buttons{display:flex;gap:8px;margin-top:14px}.buttons button{flex:1}.muted{color:#5c6d83;font-size:13px}.hidden{display:none}.links{word-break:break-all;font-size:13px;text-align:left}footer{text-align:center;padding:20px;color:#63748a}</style></head><body><header><h1 id="title">空手大会 試合進行状況</h1><div>現在の試合番号を確認できます</div></header><main class="wrap"><nav class="tabs"><button id="allTab">全コート一覧</button><button id="courtTab">コート別表示</button><button id="adminTab">スタッフ入力</button></nav><section id="all"><div class="grid" id="cards"></div></section><section id="court" class="hidden"><div class="card control"><label for="viewCourt">表示するコート</label><select id="viewCourt"></select><div class="name" id="singleName"></div><div class="num" id="singleNum"></div><div class="status" id="singleStatus"></div></div></section><section id="admin" class="hidden"><div class="card control"><h2>スタッフ専用入力</h2><p class="muted">公開運用時は認証付きの管理画面をご利用ください。</p><label for="editCourt">担当コート</label><select id="editCourt"></select><label for="number">現在の試合番号</label><input id="number" type="number" min="0" max="9999" inputmode="numeric"><div class="buttons"><button id="minus">−1</button><button id="plus">＋1</button></div><label for="status">進行状況</label><select id="status"><option>試合中</option><option>開会式</option><option>休憩</option><option>試合終了</option><option>試合開始前</option></select><div class="buttons"><button class="primary" id="save">更新する</button></div><p id="saved" aria-live="polite"></p></div></section><section class="card" style="margin-top:20px"><b>ページ共有用リンク</b><p class="links" id="urls"></p><p class="muted">この試作版は同じブラウザ内で保存・反映されます。別端末とのリアルタイム同期には公開サーバーが必要です。</p></section></main><footer>空手大会 試合進行システム</footer><script>const params=new URLSearchParams(location.search);const names=(params.get('courts')||'A,B,C,D,E,F,G,M').split(',').map(x=>x.trim()).filter(Boolean);const eventName=params.get('event')||'空手大会';document.getElementById('title').textContent=eventName+' 試合進行状況';const key='karate-progress:'+eventName;let data;try{data=JSON.parse(localStorage.getItem(key))||{}}catch{data={}};for(const n of names)if(!data[n])data[n]={number:0,status:'試合開始前'};const $=id=>document.getElementById(id);let selected=params.get('court')||names[0];if(!names.includes(selected))selected=names[0];for(const id of ['viewCourt','editCourt']){$(id).innerHTML=names.map(n=>`<option value="${n}">${n}コート</option>`).join('');$(id).value=selected}function persist(){localStorage.setItem(key,JSON.stringify(data));render()}function render(){$('cards').innerHTML=names.map(n=>`<article class="card"><div class="name">${n}コート</div><div class="num">${data[n].number||'—'}</div><div class="status">${data[n].status}</div></article>`).join('');const n=$('viewCourt').value;$('singleName').textContent=n+'コート';$('singleNum').textContent=data[n].number||'—';$('singleStatus').textContent=data[n].status;const e=$('editCourt').value;$('number').value=data[e].number;$('status').value=data[e].status}function tab(which){for(const id of ['all','court','admin'])$(id).classList.toggle('hidden',id!==which);for(const [id,w] of [['allTab','all'],['courtTab','court'],['adminTab','admin']])$(id).classList.toggle('active',w===which)}$('allTab').onclick=()=>tab('all');$('courtTab').onclick=()=>tab('court');$('adminTab').onclick=()=>tab('admin');$('viewCourt').onchange=render;$('editCourt').onchange=render;$('minus').onclick=()=>{$('number').value=Math.max(0,Number($('number').value)-1)};$('plus').onclick=()=>{$('number').value=Math.min(9999,Number($('number').value)+1)};$('save').onclick=()=>{const n=$('editCourt').value,v=Number($('number').value);if(!Number.isInteger(v)||v<0||v>9999){$('saved').textContent='0〜9999の整数を入力してください';return}data[n]={number:v,status:$('status').value};persist();$('saved').textContent=n+'コートを更新しました'};window.addEventListener('storage',e=>{if(e.key===key){try{data=JSON.parse(e.newValue)||data;render()}catch{}}});const base=location.href.split('?')[0];$('urls').textContent=`全体：${base}?event=${encodeURIComponent(eventName)} ／ コート別：${base}?event=${encodeURIComponent(eventName)}&court=A`;if(params.has('court'))$('viewCourt').value=selected;render();tab(params.get('mode')==='admin'?'admin':params.has('court')?'court':'all');</script></body></html>
